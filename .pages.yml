media:
  - name: images
    label: Images
    input: static/img
    output: /img
    rename: safe
    extensions: [png, jpg, webp]

components:
  page-fields:
    type: object
    label: Page
    fields:
      - name: title
        type: string
        required: true
        options:
          maxlength: 120
      - name: subtitle
        label: Subtitle
        type: text
        description: Shown under the title in the page header.
      - name: background
        label: Background image
        type: image
        options:
          media: images
      - name: herosize
        label: Large hero
        type: select
        options:
          values:
            - name: lg
              label: "Yes (tall header)"
      - name: translationKey
        label: Translation key
        type: string
        required: true
        description: Must match the translation key of the corresponding page in the other language, so the language switcher can link them together.
      - name: date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        type: boolean
        default: false
        description: Draft pages are excluded from the published site.
      - name: aliases
        label: URL aliases
        type: string
        list: true
        description: Old URL paths that should redirect to this page.
      - name: body
        label: Content
        type: rich-text
        options:
          media: images

content:
  - name: pages
    label: Pages
    type: group
    items:
      - name: pages-is
        label: "Síður (íslenska)"
        type: collection
        path: content/is-IS
        subfolders: false
        format: yaml-frontmatter
        filename: "{primary}.md"
        exclude: ["test.md"]
        fields:
          - component: page-fields
        view:
          primary: title
          fields: [title, translationKey, draft, date]
          sort: [title, date]
          search: [title, subtitle]
          default:
            sort: title
            order: asc

      - name: pages-en
        label: "Pages (English)"
        type: collection
        path: content/en-EU
        subfolders: false
        format: yaml-frontmatter
        filename: "{primary}.md"
        exclude: ["test.md"]
        fields:
          - component: page-fields
        view:
          primary: title
          fields: [title, translationKey, draft, date]
          sort: [title, date]
          search: [title, subtitle]
          default:
            sort: title
            order: asc

